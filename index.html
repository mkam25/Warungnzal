<script>
window.checkOrderStatus=async function(){
  const id=String(prompt("Masukkan nomor pesanan (contoh: WN-ABC123)")||"").trim().toUpperCase();
  if(!id)return;
  const phone=String(prompt("Masukkan nomor WhatsApp yang dipakai saat checkout")||"").trim();
  if(!phone)return;
  const r=await fetch("/api/order-status?id="+encodeURIComponent(id)+"&phone="+encodeURIComponent(phone)).then(x=>x.json()).catch(()=>({ok:false,message:"Server tidak dapat dihubungi."}));
  if(!r.ok)return alert(r.message||"Pesanan tidak ditemukan.");
  const o=r.order||{};
  const fmt=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
  const items=(o.items||[]).map(x=>x.name+" × "+x.qty+" = "+fmt(x.subtotal)).join("\n");
  alert("📦 PESANAN "+o.id+"\n\nStatus: "+(o.status||"Baru")+"\nPemesan: "+(o.customer_name||"-")+"\nTotal: "+fmt(o.total||0)+"\nPembayaran: "+(o.payment_method||"Tunai")+"\n\n"+items);
};
</script>

<script>
const DEFAULT_PRODUCTS = [
  {id:1,name:"Coklat",price:10000,emoji:"🍫",bg:"#b96f45"},
  {id:2,name:"Cookies & Cream",price:10000,emoji:"🍪",bg:"#b7b7b7"},
  {id:3,name:"Vanilla Regal",price:10000,emoji:"🍦",bg:"#e8d6a4"},
  {id:4,name:"Milky Strawberry",price:10000,emoji:"🍓",bg:"#f27fa6"},
  {id:5,name:"Tiramisu Brownies",price:10000,emoji:"☕",bg:"#8b624d"},
  {id:6,name:"Matcha",price:10000,emoji:"🍵",bg:"#73b45b"},
  {id:7,name:"Avocado",price:10000,emoji:"🥑",bg:"#65a95b"}
];

let products=[];
let cart=JSON.parse(localStorage.nzal_cart||"[]");
let token=null;
try{token=localStorage.getItem("nzal_admin_token")||sessionStorage.getItem("nzal_admin_token")||null}catch(e){}
let adminData={products:[],orders:[]};

const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);

async function api(action,data={}){ 
  try{
    const headers={"Content-Type":"application/json"};
    if(token) headers["x-admin-password"]=token;
    const r=await fetch("/api/",{method:"POST",headers,body:JSON.stringify({action,...data})});
    return await r.json();
  }catch(e){return {ok:false,error:e.message};}
}

function renderProducts(){
  const box=$("products");
  const q=String($("menuSearch")?.value||"").trim().toLowerCase();
  const active=document.querySelector(".category-chip.active")?.dataset.category||"Semua";
  const filtered=products.filter(p=>{
    const hay=(String(p.name||"")+" "+String(p.description||"")+" "+String(p.category||"")).toLowerCase();
    return (!q||hay.includes(q)) && (active==="Semua"||String(p.category||"Lainnya")===active);
  });
  if(!filtered.length){box.innerHTML='<div class="empty">Menu tidak ditemukan.</div>';return}
  box.innerHTML=filtered.map(p=>{
    const photo=p.image ? '<img src="'+escapeAttr(p.image)+'" alt="'+escapeAttr(p.name)+'" style="width:100%;height:100%;object-fit:cover;object-position:center;border-radius:16px;display:block">' : '<div class="ice" style="--flavor:'+(p.bg||"#f7c6d9")+'"></div>';
    const stock=Math.max(0,Number(p.stock)||0);
    const low=stock>0 && stock<=Math.max(0,Number(p.reorder_level)||5);
    const badge=stock<=0?'<span class="stock-badge stock-out">Habis</span>':low?'<span class="stock-badge stock-low">Stok menipis • '+stock+'</span>':'<span class="stock-badge stock-ok">Stok '+stock+'</span>';    const cat='<span style="display:inline-block;margin:5px auto 0;padding:4px 8px;border-radius:99px;background:#fff0f5;color:var(--p);font-size:10px;font-weight:800">'+escapeHtml(p.category||"Lainnya")+'</span>';
    return '<article class="card"><div class="pic" style="--bg:'+(p.bg||"#f7c6d9")+'">'+photo+'</div><h3>'+(p.emoji||"🍦")+' '+escapeHtml(p.name)+'</h3><div class="price">'+money(Number(p.price)||0)+'</div><div class="sub">'+escapeHtml(p.description||"Ice Cream Gabin")+'</div>'+cat+badge+'<button class="add" '+(stock<=0?'disabled':'')+' onclick="add('+Number(p.id)+')">'+(stock<=0?'Habis':' + Tambah')+'</button></article>';
  }).join("");
}
function renderCategories(){
  const box=$("categoryChips"); if(!box)return;
  const cats=["Semua",...new Set(products.map(p=>String(p.category||"Lainnya")).filter(Boolean))];
  box.innerHTML=cats.map(c=>'<button type="button" class="category-chip '+(c==="Semua"?'active':'')+'" data-category="'+escapeAttr(c)+'" onclick="filterCategory(this)">'+escapeHtml(c)+'</button>').join("");
}
function filterCategory(btn){
  document.querySelectorAll(".category-chip").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active"); renderProducts();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(s){return escapeHtml(s)}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file)return resolve("");
    if(!file.type.startsWith("image/"))return reject(new Error("File harus berupa gambar."));
    if(file.size>8*1024*1024)return reject(new Error("Foto maksimal 8 MB."));
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        const data=c.toDataURL("image/jpeg",.72);
        if(data.length>1900000)return reject(new Error("Foto masih terlalu besar. Pilih foto lain."));
        resolve(data);
      };
      img.onerror=()=>reject(new Error("Foto tidak bisa dibaca."));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("Gagal membaca foto."));
    reader.readAsDataURL(file);
  });
}
async function load(){
  const r=await fetch("/api/products").then(x=>x.json()).catch(()=>({ok:false}));
  products=(r.ok&&Array.isArray(r.products)&&r.products.length)?r.products:DEFAULT_PRODUCTS;
  renderCategories(); renderProducts(); renderCart();
}
function add(id){
  const p=products.find(x=>Number(x.id)===Number(id)); if(!p)return;
  const stock=Math.max(0,Number(p.stock)||0);
  if(stock<=0)return alert("Produk sedang habis.");
  const x=cart.find(x=>Number(x.id)===Number(id));
  if(x){
    if(x.qty>=stock)return alert("Jumlah di keranjang sudah mencapai stok tersedia ("+stock+").");
    x.qty++;
  }else cart.push({id:Number(p.id),qty:1});
  localStorage.nzal_cart=JSON.stringify(cart); renderCart(); openCart();
}
function renderCart(){
  const list=$("cartList"); let total=0,count=0;
  if(!cart.length){list.innerHTML='<div class="empty">Keranjang masih kosong.</div>'}
  else list.innerHTML=cart.map(x=>{
    const p=products.find(p=>Number(p.id)===Number(x.id)); if(!p)return "";
    const sub=Number(p.price)*Number(x.qty); total+=sub; count+=Number(x.qty);
    return `<div class="item"><div><b>${p.emoji||"🍦"} ${escapeHtml(p.name)}</b><br><small>${money(p.price)} × ${x.qty}</small></div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button> <b>${x.qty}</b> <button onclick="changeQty(${p.id},1)">+</button></div></div>`;
  }).join("");
  $("count").textContent=count; $("total").textContent=money(total);
}
function changeQty(id,d){
  const x=cart.find(x=>Number(x.id)===Number(id)); if(!x)return;
  const p=products.find(p=>Number(p.id)===Number(id));
  const stock=p?Math.max(0,Number(p.stock)||0):0;
  if(d>0 && x.qty>=stock)return alert(stock>0?"Jumlah sudah mencapai stok tersedia ("+stock+").":"Produk sedang habis.");
  x.qty+=d;
  if(x.qty<=0)cart=cart.filter(y=>Number(y.id)!==Number(id));
  localStorage.nzal_cart=JSON.stringify(cart); renderCart();
}
function openCart(){$("overlay").classList.add("on");$("drawer").classList.add("on")}
function closeCart(){$("overlay").classList.remove("on");$("drawer").classList.remove("on")}
function goToMenu(){const menu=$("menu");if(menu)menu.scrollIntoView({behavior:"smooth",block:"start"})}window.goToMenu=goToMenu;
let selectedPayment="Tunai";
let lastReceipt=null;

function checkout(){
  if(!cart.length)return alert("Keranjang masih kosong.");
  selectedPayment="Tunai";
  const total=cart.reduce((sum,x)=>{const p=products.find(p=>Number(p.id)===Number(x.id));return sum+(p?Number(p.price)*Number(x.qty):0)},0);
  $("checkoutItems").innerHTML=cart.map(x=>{
    const p=products.find(p=>Number(p.id)===Number(x.id));
    return p?'<div class="receipt-row"><span>'+escapeHtml(p.name)+' × '+Number(x.qty)+'</span><b>'+money(Number(p.price)*Number(x.qty))+'</b></div>':"";
  }).join("");
  $("checkoutTotal").textContent=money(total);
  $("customerName").value=localStorage.nzal_customer_name||"";
  $("customerPhone").value=localStorage.nzal_customer_phone||"";
  $("customerAddress").value=localStorage.nzal_customer_address||"";
  $("promoCode").value="";$("promoInfo").textContent="";
  $("paid").value="";
  $("change").textContent=money(0);
  document.querySelectorAll(".pay-btn").forEach(b=>b.classList.toggle("active",b.dataset.pay==="Tunai"));
  $("cashArea").style.display="block";
  $("checkoutModal").classList.add("on");
  setTimeout(()=>$("paid").focus(),50);
}
function closeCheckout(){$("checkoutModal").classList.remove("on")}
function selectPayment(method,btn){
  selectedPayment=method;
  document.querySelectorAll(".pay-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  $("cashArea").style.display=method==="Tunai"?"block":"none";
}
function updateChange(){
  const total=Number($("checkoutTotal").textContent.replace(/[^0-9]/g,""))||0;
  const paid=Number($("paid").value)||0;
  $("change").textContent=money(Math.max(0,paid-total));
}
async function checkPromo(){
  const code=String($("promoCode").value||"").trim().toUpperCase(); if(!code)return;
  const subtotal=cart.reduce((sum,x)=>{const p=products.find(p=>Number(p.id)===Number(x.id));return sum+(p?Number(p.price)*Number(x.qty):0)},0);
  const r=await api("check-promo",{code,subtotal}); if(!r.ok){$("promoInfo").textContent=r.message||"Promo tidak valid.";return}
  $("promoInfo").textContent="Promo aktif: hemat "+money(r.discount)+" • Total "+money(subtotal-r.discount);$("checkoutTotal").textContent=money(subtotal-r.discount);
}
async function payNow(){
  if(!cart.length)return alert("Keranjang masih kosong.");
  const fresh=await fetch("/api/products").then(x=>x.json()).catch(()=>({ok:false}));
  if(!fresh.ok||!Array.isArray(fresh.products))return alert("Menu sedang tidak bisa diperbarui. Coba lagi.");
  products=fresh.products;
  for(const x of cart){
    const p=products.find(p=>Number(p.id)===Number(x.id));
    const stock=p?Math.max(0,Number(p.stock)||0):0;
    if(!p)return alert("Ada produk yang sudah tidak tersedia. Keranjang akan diperbarui.");
    if(Number(x.qty)>stock){
      x.qty=stock;
      if(x.qty<=0)cart=cart.filter(y=>Number(y.id)!==Number(x.id));
      localStorage.nzal_cart=JSON.stringify(cart);
      renderCart();
      return alert("Stok "+p.name+" tidak mencukupi. Jumlah keranjang sudah disesuaikan.");
    }
  }
  const subtotal=cart.reduce((sum,x)=>{const p=products.find(p=>Number(p.id)===Number(x.id));return sum+(p?Number(p.price)*Number(x.qty):0)},0);
  const promo_code=String($("promoCode").value||"").trim().toUpperCase();
  let discount=0,total=subtotal;
  if(promo_code){
    const pr=await api("check-promo",{code:promo_code,subtotal});
    if(!pr.ok)return alert(pr.message||"Promo tidak valid.");
    discount=Number(pr.discount||0);total=Math.max(0,subtotal-discount);
  }
  const paid=selectedPayment==="Tunai"?(Number($("paid").value)||0):total;  const customer={name:$("customerName").value.trim(),phone:$("customerPhone").value.trim(),address:$("customerAddress").value.trim()};
  if(!customer.name)return alert("Nama pemesan wajib diisi.");
  if(!customer.phone)return alert("Nomor WhatsApp wajib diisi.");
  if(!/^\+?[0-9\s-]{8,16}$/.test(customer.phone))return alert("Nomor WhatsApp tidak valid.");
  if(selectedPayment==="Tunai" && paid<total)return alert("Uang yang diterima masih kurang.");
  localStorage.nzal_customer_name=customer.name;localStorage.nzal_customer_phone=customer.phone;localStorage.nzal_customer_address=customer.address;
  const r=await api("save-order",{items:cart,customer,payment_method:selectedPayment,paid,promo_code});
  if(!r.ok)return alert(r.message||"Transaksi gagal disimpan.");
  const order=r.order;
  lastReceipt={...order,created_at:new Date().toISOString()};
  $("receiptContent").innerHTML=renderReceipt(lastReceipt);
  cart=[];localStorage.nzal_cart="[]";renderCart();
  closeCheckout();$("receiptModal").classList.add("on");
}
function renderReceipt(o){
  const rows=(o.items||[]).map(x=>'<div class="receipt-row"><span>'+escapeHtml(x.name)+' × '+Number(x.qty)+'</span><span>'+money(Number(x.subtotal)||0)+'</span></div>').join("");
  return '<div class="receipt-head"><h2>🍨 WARUNG NZAL</h2><div>Ice Cream Gabin</div><small>'+escapeHtml(o.id)+'<br>'+new Date(o.created_at).toLocaleString("id-ID")+'</small></div>'+
    '<div style="padding:10px 0">'+rows+'</div>'+
    (Number(o.discount||0)>0?'<div class="receipt-row"><span>Diskon '+escapeHtml(o.promo_code||"")+'</span><b>-'+money(o.discount)+'</b></div>':"")+
    '<div class="receipt-total receipt-row"><span>TOTAL</span><span>'+money(o.total)+'</span></div>'+
    '<div class="receipt-row"><span>Pemesan</span><b>'+escapeHtml(o.customer_name||"")+'</b></div>'+
    '<div class="receipt-row"><span>WhatsApp</span><span>'+escapeHtml(o.customer_phone||"")+'</span></div>'+
    '<div class="receipt-row"><span>Pembayaran</span><b>'+escapeHtml(o.payment_method||"Tunai")+'</b></div>'+
    (o.payment_method==="Tunai"?'<div class="receipt-row"><span>Dibayar</span><span>'+money(o.paid)+'</span></div><div class="receipt-row"><span>Kembalian</span><b>'+money(o.change_amount||0)+'</b></div>':"")+
    '<p style="text-align:center;margin:18px 0 4px">Terima kasih ❤️</p>';
}
function closeReceipt(){$("receiptModal").classList.remove("on")}
function printReceipt(){
  if(!lastReceipt)return;
  const w=window.open("","_blank","width=420,height=700");
  w.document.write('<html><head><title>Struk '+escapeHtml(lastReceipt.id)+'</title><style>body{font-family:Arial;padding:18px;max-width:380px;margin:auto}.receipt-row{display:flex;justify-content:space-between;padding:5px 0}.receipt-total{border-top:1px dashed #999;margin-top:8px;padding-top:10px;font-weight:bold}</style></head><body>'+renderReceipt(lastReceipt)+'<script>window.onload=function(){window.print()}<\/script></body></html>');
  w.document.close();
}
function sendReceiptWhatsApp(){
  if(!lastReceipt)return;
  const raw=String(lastReceipt.customer_phone||"").replace(/[^0-9+]/g,"");
  let phone=raw.replace(/^\+/,"");
  if(phone.startsWith("0"))phone="62"+phone.slice(1);
  if(phone.startsWith("8"))phone="62"+phone;
  if(!/^62[0-9]{8,14}$/.test(phone))return alert("Nomor WhatsApp pelanggan tidak valid.");
  const lines=(lastReceipt.items||[]).map(x=>"• "+x.name+" x"+x.qty+" — "+money(x.subtotal)).join("\n");
  const text=encodeURIComponent(
    "🧾 *STRUK WARUNG NZAL*\n"+
    "No. Pesanan: "+lastReceipt.id+"\n"+
    "Halo "+(lastReceipt.customer_name||"Pelanggan")+", terima kasih sudah memesan.\n\n"+
    lines+"\n\n"+
    "Subtotal: "+money(lastReceipt.subtotal||0)+
    (Number(lastReceipt.discount||0)>0?"\nDiskon: -"+money(lastReceipt.discount):"")+
    "\n*TOTAL: "+money(lastReceipt.total)+"*\n"+
    "Pembayaran: "+(lastReceipt.payment_method||"Tunai")+
    (lastReceipt.payment_method==="Tunai"?"\nDibayar: "+money(lastReceipt.paid||0)+"\nKembalian: "+money(lastReceipt.change_amount||0):"")+
    "\n\nWarung Nzal 🍨"
  );
  window.open("https://wa.me/"+phone+"?text="+text,"_blank");
}
function resetAdminView(){
  const saved=token;
  $("adminModal").classList.remove("on");
  $("pass").value="";
  if(saved){
    $("login").style.display="none";
    $("admin").style.display="block";
  }else{
    $("login").style.display="block";
    $("admin").style.display="none";
  }
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("show"));
  const dash=$("dash");if(dash)dash.classList.add("show");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  const firstTab=document.querySelector(".tabs .tab");if(firstTab)firstTab.classList.add("active");
}
window.addEventListener("pageshow",async()=>{resetAdminView();if(token){$("login").style.display="none";$("admin").style.display="block";await refreshAdmin()}});
function logoutAdmin(){token=null;try{localStorage.removeItem("nzal_admin_token");sessionStorage.removeItem("nzal_admin_token")}catch(e){}$("admin").style.display="none";$("login").style.display="block";$("pass").value="";$("adminModal").classList.remove("on");document.querySelectorAll(".panel").forEach(x=>x.classList.remove("show"));const dash=$("dash");if(dash)dash.classList.add("show")}

function openAdmin(){$("adminModal").classList.add("on");$("pass").focus()}
function closeAdmin(){$("adminModal").classList.remove("on")}
async function login(){
  const pass=$("pass").value;
  const r=await api("login",{password:pass});
  if(!r.ok){alert(r.message||"Password salah.");return}
  token=r.token;
  try{localStorage.setItem("nzal_admin_token",token);sessionStorage.setItem("nzal_admin_token",token)}catch(e){}
  $("login").style.display="none";$("admin").style.display="block";await refreshAdmin();
}
let orderFilter="Semua";
function openOrdersByStatus(status){
  showTab("orders",null);
  setOrderFilter(status,null);
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  const orderTab=[...document.querySelectorAll(".tab")].find(x=>String(x.getAttribute("onclick")||"").includes("showTab('orders'"));
  if(orderTab)orderTab.classList.add("active");
  document.getElementById("orders").scrollIntoView({behavior:"smooth",block:"start"});
}
function setOrderFilter(status,btn){orderFilter=status;document.querySelectorAll("#orderFilterBox button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");renderAdminOrders((adminData&&adminData.orders)||[]);}
function renderAdminOrders(orders){
 const filtered=orderFilter==="Semua"?orders:orders.filter(o=>String(o.status||"Baru")===orderFilter);
 $("orderTable").innerHTML=filtered.length?filtered.map(o=>{
  const s=o.status||"Baru";
  return '<tr class="'+(s==="Baru"?'order-new':'')+'"><td><b>'+escapeHtml(o.id)+'</b><br><small>'+new Date(o.created_at).toLocaleString("id-ID")+'</small></td><td><b>'+escapeHtml(o.customer_name||"-")+'</b><br><small>'+escapeHtml(o.customer_phone||"")+'</small></td><td>'+money(o.total)+'</td><td>'+escapeHtml(o.payment_method||"Tunai")+'</td><td><select class="status status-'+statusClass(s)+'" onchange="updateStatus(\''+escapeAttr(o.id)+'\',this.value)"><option '+(s==="Baru"?"selected":"")+'>Baru</option><option '+(s==="Diproses"?"selected":"")+'>Diproses</option><option '+(s==="Siap"?"selected":"")+'>Siap</option><option '+(s==="Selesai"?"selected":"")+'>Selesai</option><option '+(s==="Batal"?"selected":"")+'>Batal</option></select></td><td><button class="smallbtn" onclick="openOrderDetail(\''+escapeAttr(o.id)+'\')">Detail</button> <button class="smallbtn green" onclick="waCustomer(\''+escapeAttr(o.customer_phone||"")+'\',\''+escapeAttr(o.id)+'\',\''+escapeAttr(s)+'\')">WA</button></td></tr>';
 }).join(""):'<tr><td colspan="6">Tidak ada pesanan pada status ini.</td></tr>';
}
function openOrderDetail(id){
 const o=(adminData&&adminData.orders||[]).find(x=>String(x.id)===String(id));if(!o)return;
 const rows=(o.items||[]).map(x=>'<div class="receipt-row"><span>'+escapeHtml(x.name||"Produk")+' × '+Number(x.qty||0)+'</span><b>'+money(Number(x.subtotal)||0)+'</b></div>').join("");
 $("orderDetailContent").innerHTML='<div class="receipt-head"><h2>'+escapeHtml(o.id)+'</h2><small>'+new Date(o.created_at).toLocaleString("id-ID")+'</small></div><div style="padding:10px 0">'+rows+'</div>'+(Number(o.discount||0)>0?'<div class="receipt-row"><span>Diskon</span><b>-'+money(o.discount)+'</b></div>':"")+'<div class="receipt-total receipt-row"><span>TOTAL</span><b>'+money(o.total||0)+'</b></div><div class="receipt-row"><span>Status</span><b>'+escapeHtml(o.status||"Baru")+'</b></div><div class="receipt-row"><span>Pemesan</span><b>'+escapeHtml(o.customer_name||"-")+'</b></div><div class="receipt-row"><span>WhatsApp</span><span>'+escapeHtml(o.customer_phone||"-")+'</span></div><div class="receipt-row"><span>Alamat</span><span>'+escapeHtml(o.customer_address||"-")+'</span></div><div class="receipt-row"><span>Pembayaran</span><b>'+escapeHtml(o.payment_method||"Tunai")+'</b></div>'+(o.payment_method==="Tunai"?'<div class="receipt-row"><span>Dibayar / Kembalian</span><span>'+money(o.paid||0)+' / '+money(o.change_amount||0)+'</span></div>':"");
 $("orderDetailModal").classList.add("on");
}
function closeOrderDetail(){$("orderDetailModal").classList.remove("on")}
function statusClass(s){return String(s||"Baru").toLowerCase().replace(/[^a-z]/g,"")} 
function waCustomer(phone,id,status){
  const raw=String(phone||"").replace(/[^0-9]/g,"");
  if(!raw)return;
  const num=raw.startsWith("0")?"62"+raw.slice(1):raw;
  const msg=encodeURIComponent("Halo, pesanan "+id+" di Warung Nzal sekarang: "+status+".");
  window.open("https://wa.me/"+num+"?text="+msg,"_blank");
}
let lastKnownOrderIds=new Set();
let notificationReady=false;
let orderPollTimer=null;
async function enableOrderNotifications(){
  if(!("Notification" in window)){alert("Browser ini belum mendukung notifikasi.");return;}
  if(Notification.permission==="denied"){alert("Notifikasi diblokir. Izinkan notifikasi untuk situs Warung Nzal dari pengaturan browser.");return;}
  const permission=Notification.permission==="granted"?"granted":await Notification.requestPermission();
  notificationReady=permission==="granted";
  $("notifyStatus").textContent=notificationReady?"🔔 Notifikasi aktif":"Notifikasi belum diaktifkan";
  if(notificationReady){
    playOrderSound();
    alert("Notifikasi pesanan aktif.");
    startOrderPolling();
  }
}
function playOrderSound(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=new C(),o=c.createOscillator(),g=c.createGain();
    o.type="sine";o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+.18);o.onended=()=>c.close();
  }catch(e){}
}
async function notifyNewOrder(order){
  playOrderSound();
  if(!notificationReady||Notification.permission!=="granted")return;
  try{
    const reg=navigator.serviceWorker?.controller?await navigator.serviceWorker.getRegistration():null;
    if(reg) await reg.showNotification("🔔 Pesanan Baru - Warung Nzal",{body:"Pesanan "+order.id+" dari "+(order.customer_name||"Pelanggan")+" • "+money(order.total||0),tag:"order-"+order.id});
  }catch(e){}
}
